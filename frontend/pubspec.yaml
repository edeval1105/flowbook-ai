name: agenda_app
description: Um aplicativo de agenda em Flutter com suporte Web e Mobile.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  flutter_localizations:
    sdk: flutter
  
  cupertino_icons: ^1.0.2
  http: ^1.1.0
  shared_preferences: ^2.5.5
  intl: any
  table_calendar: ^3.1.2
  url_launcher: ^6.3.0
  app_links: ^7.1.0
  flutter_riverpod: ^3.3.1
  fluttertoast: ^9.1.0
  fl_chart: ^0.068.0
  provider: ^6.1.2
  
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
